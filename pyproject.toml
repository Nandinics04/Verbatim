[project]
name = "verbatim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nandini Amaravadi", email = "nandiniamaravadi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain-huggingface>=1.2.3",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
verbatim = "verbatim:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
